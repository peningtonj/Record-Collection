name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile (desktop + shared)
        run: ./gradlew :composeApp:compileKotlinDesktop :composeApp:compileTestKotlinDesktop --no-daemon

      - name: Shared tests (JVM)
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: composeApp/build/reports/tests/desktopTest/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is git-ignored (TECH_DEBT 2.4) — write a stub so the
      # Android build can resolve Firebase config in CI.
      - name: Firebase config stub
        run: |
          cat > composeApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": { "package_name": "io.github.peningtonj.recordcollection" }
                },
                "api_key": [ { "current_key": "ci-stub" } ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Compile Android (debug)
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web bundle (Kotlin/JS + webpack)
        run: ./gradlew :composeApp:jsBrowserDevelopmentWebpack --no-daemon
